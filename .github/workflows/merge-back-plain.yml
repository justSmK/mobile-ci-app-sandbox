name: Merge-back into a branch without required checks

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base branch without rules'
        required: true
        default: 'plain'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MOBILE_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOBILE_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ inputs.base }}
        run: gh pr create --base "$BASE" --head master --title "Merge 'master' into '$BASE'" --body "Automated merge-back into a branch without required checks"
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ inputs.base }}
        run: |
          pr_number=$(gh pr list --base "$BASE" --head master --json number --jq '.[0].number')
          gh pr merge "$pr_number" --merge --auto
