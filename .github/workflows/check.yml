name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report actor and wait
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "actor=$GITHUB_ACTOR triggering_actor=$TRIGGERING_ACTOR"
          sleep 60
