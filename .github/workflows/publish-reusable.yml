name: Publish reusable

on:
  workflow_call:
    secrets:
      MOBILE_CI_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  merge:
    if: startsWith(github.head_ref, 'release/') && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MOBILE_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOBILE_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ vars.SANDBOX_PERMISSION_WORKFLOWS }}
      - name: Checkout develop branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr create --base develop --head master --title "Merge 'master' into 'develop' after release" --body "Automated Pull Request to merge 'master' into 'develop' after release"
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number=$(gh pr list --base develop --head master --json number --jq '.[0].number')
          gh pr merge "$pr_number" --merge --auto
